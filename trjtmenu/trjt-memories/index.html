<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galery TRJT 24 - SikanCuyy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Sora:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../favicon/08_besto_friendo.svg" type="image/svg+xml">
    <style>
        /* HERO SLIDESHOW BANNER */
        .hero-slider-wrap {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 22px;
            box-shadow: var(--shadow-lg);
            background: #0f172a;
        }

        .hero-slides-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }

        .hero-slide-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 6s ease-out;
            pointer-events: none;
        }

        .hero-slide-img.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Hero Progress Bar */
        .hero-progress-track {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            z-index: 10;
        }

        .hero-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #8b5cf6, #ec4899);
        }

        /* Hero Overlay & Text */
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.35) 45%, transparent 75%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px 28px;
            color: #ffffff;
            pointer-events: none;
            z-index: 5;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: fit-content;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        .hero-badge-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .hero-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0 0 14px 0;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            max-width: 80%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .hero-action-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.25s ease;
        }

        .hero-action-btn:hover {
            background: #ffffff;
            color: #111827;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .hero-pause-btn {
            padding: 7px 11px;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            justify-content: center;
        }

        /* Hero Arrows */
        .hero-arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 10;
            font-size: 0.95rem;
        }

        .hero-arrow-btn:hover {
            background: rgba(15, 23, 42, 0.85);
            color: var(--accent);
            transform: translateY(-50%) scale(1.1);
            border-color: var(--accent);
        }

        .hero-arrow-btn.prev { left: 16px; }
        .hero-arrow-btn.next { right: 16px; }

        /* Hero Dots */
        .hero-dots {
            position: absolute;
            bottom: 16px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .hero-dot {
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-dot.active {
            width: 22px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        @media (max-width: 600px) {
            .hero-slider-wrap {
                height: 270px;
            }
            .hero-title {
                font-size: 1.15rem;
                max-width: 100%;
            }
            .hero-overlay {
                padding: 16px 18px;
            }
            .hero-dots {
                display: none;
            }
            .hide-mobile {
                display: none;
            }
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .gallery-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }

        .gallery-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .gallery-card .caption {
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
        }

        @keyframes skeleton-shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(180, 180, 180, 0.12) 25%, rgba(180, 180, 180, 0.28) 50%, rgba(180, 180, 180, 0.12) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite ease-in-out;
        }

        body.dark .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.12) 50%, rgba(255, 255, 255, 0.04) 75%);
            background-size: 200% 100%;
        }

        .skeleton-card {
            pointer-events: none;
        }

        .skeleton-thumb {
            width: 100%;
            height: 120px;
            border-radius: var(--radius-sm);
        }

        .skeleton-text {
            height: 12px;
            width: 70%;
            margin: 10px auto 4px auto;
            border-radius: 4px;
        }

        .collage-box {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            margin-top: 20px;
        }

        .collage-box img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            .collage-box {
                grid-template-columns: repeat(3, 1fr);
            }

            .hero-img-box {
                height: 250px;
            }
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .spinner {
            /* Spinner size and color */
            width: 1.5rem;
            height: 1.5rem;
            border-top-color: #444;
            border-left-color: #444;

            /* Additional spinner styles */
            animation: spinner 400ms linear infinite;
            border-bottom-color: transparent;
            border-right-color: transparent;
            border-style: solid;
            border-width: 2px;
            border-radius: 50%;
            box-sizing: border-box;
            display: inline-block;
            vertical-align: middle;
        }

        body.dark .spinner {
            border-top-color: #f1f5f9;
            border-left-color: #f1f5f9;
        }

        /* LIGHTBOX & FULLSCREEN SLIDESHOW */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .lightbox.open {
            display: flex;
        }

        /* Lightbox Toolbar */
        .lightbox-toolbar {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2020;
            pointer-events: auto;
        }

        .lb-counter {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.88rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 0.5px;
        }

        .lb-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lb-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            height: 38px;
            padding: 0 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .lb-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .lb-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .lb-btn-close {
            width: 38px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .lb-btn-close:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
        }

        /* Lightbox Progress Bar */
        .lb-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 2030;
        }

        .lb-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #38bdf8);
        }

        /* Lightbox Nav Arrows */
        .lb-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 2010;
            font-size: 1.15rem;
        }

        .lb-nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .lb-nav-btn.prev { left: 20px; }
        .lb-nav-btn.next { right: 20px; }

        @media (max-width: 600px) {
            .lb-nav-btn {
                width: 38px;
                height: 38px;
                font-size: 0.95rem;
            }
            .lb-nav-btn.prev { left: 10px; }
            .lb-nav-btn.next { right: 10px; }
            .lb-btn-text { display: none; }
        }

        .lightbox-content {
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 88vw;
            max-height: 82vh;
            margin-top: 25px;
        }

        .lightbox-spinner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 12px;
            min-height: 180px;
        }

        .lightbox .spinner {
            width: 2.5rem;
            height: 2.5rem;
            border-width: 3px;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
        }

        .lightbox-spinner-wrap .spinner-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            transition: opacity 0.25s ease;
            object-fit: contain;
        }

        .lb-caption-box {
            margin-top: 14px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            max-width: 85%;
        }

        .lb-caption-box p {
            color: #ffffff;
            margin: 0;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        /* TOOLBAR & FILTER CARD */
        .gallery-toolbar-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
        }

        .search-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 180px;
        }

        .search-input-wrap input {
            border: none;
            padding: 0;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
            color: inherit;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .photo-count-badge {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--surface-2);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .photo-count-badge i {
            color: var(--accent);
        }

        .btn-tool {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-tool:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        body.dark .btn-tool:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-color: #818cf8;
        }

        /* Drive Loading Box */
        .drive-loading-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drive-loading-box.hidden {
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-bottom: 0;
            border-color: transparent;
            pointer-events: none;
        }

        .drive-loading-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .drive-icon-container {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(66, 133, 244, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        body.dark .drive-icon-container {
            background: rgba(66, 133, 244, 0.16);
        }

        .drive-brand-icon {
            font-size: 1.65rem;
            background: linear-gradient(135deg, #4285F4 20%, #0F9D58 55%, #F4B400 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: driveFloat 2.2s ease-in-out infinite alternate;
        }

        @keyframes driveFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-3px) scale(1.08); }
        }

        .drive-pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 14px;
            border: 2px solid rgba(66, 133, 244, 0.4);
            animation: drivePulse 2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
            pointer-events: none;
        }

        @keyframes drivePulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            70% { transform: scale(1.15); opacity: 0; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        .drive-info {
            flex: 1;
            min-width: 0;
        }

        .drive-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drive-dots {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .drive-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            animation: driveDotBounce 1.4s infinite ease-in-out both;
        }

        .drive-dots span:nth-child(1) { animation-delay: -0.32s; }
        .drive-dots span:nth-child(2) { animation-delay: -0.16s; }
        .drive-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes driveDotBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .drive-subtext {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .drive-progress-track {
            height: 4px;
            width: 100%;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 14px;
            position: relative;
        }

        body.dark .drive-progress-track {
            background: rgba(255, 255, 255, 0.08);
        }

        .drive-progress-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            border-radius: 99px;
            background: linear-gradient(90deg, #4285F4, #0F9D58, #F4B400, #4285F4);
            background-size: 200% 100%;
            animation: driveIndeterminate 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes driveIndeterminate {
            0% { left: -40%; background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { left: 100%; background-position: 200% 50%; }
        }

        /* Reload button */
        .btn-icon-reload {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .btn-icon-reload:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-light);
            transform: rotate(45deg);
        }

        body.dark .btn-icon-reload:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .btn-icon-reload.spinning i {
            animation: spinner 0.7s linear infinite;
            color: var(--accent);
        }

        /* Sound Control Card below Search */
        /* Sound Control Card below Search - STRICTLY SINGLE ROW (SATU BARIS) */
        .sound-control-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .sound-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1 1 auto;
            overflow: hidden;
        }

        .sound-equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
            padding-bottom: 1px;
            flex-shrink: 0;
        }

        .sound-equalizer span {
            width: 3px;
            background: var(--accent);
            border-radius: 3px;
            animation: eqWave 1.2s ease-in-out infinite alternate;
        }

        .sound-equalizer span:nth-child(1) { height: 60%; animation-delay: 0.1s; }
        .sound-equalizer span:nth-child(2) { height: 100%; animation-delay: 0.35s; }
        .sound-equalizer span:nth-child(3) { height: 40%; animation-delay: 0.2s; }
        .sound-equalizer span:nth-child(4) { height: 80%; animation-delay: 0.45s; }

        .sound-equalizer.paused span {
            animation-play-state: paused;
            opacity: 0.4;
            height: 25% !important;
        }

        @keyframes eqWave {
            0% { height: 25%; }
            50% { height: 100%; }
            100% { height: 40%; }
        }

        .sound-text {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            overflow: hidden;

            flex-shrink: 0;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .music-select {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            max-width: 140px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .music-select:hover, .music-select:focus {
            border-color: var(--accent);
        }

        .btn-track-nav {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;

            transition: all 0.2s ease;

        .btn-track-nav:hover {

        body.dark .btn-track-nav:hover {

        .btn-track-nav.active {

        }

        body.dark .btn-track-nav.active {
            background: #6366f1;
            color: #ffffff;
            border-color: #818cf8;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .btn-sound-toggle {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            font-family: inherit;
            white-space: nowrap;

        }

        .btn-sound-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
            transform: translateY(-1px);

        .btn-sound-toggle.playing {

        body.dark .btn-sound-toggle.playing {

        .btn-sound-toggle.playing i {

        @media (max-width: 600px) {

<body>

                <div class="sound-text">

        <!-- Indikator Memuat dari Drive -->

        <div id="gallery" class="gallery-grid">

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <!-- Top Toolbar -->

            <div class="lb-counter" id="lbCounter">1 / 1</div>
            <div class="lb-actions">
                <button class="lb-btn" id="btnLbSlide" onclick="toggleLbSlideshow()" title="Mulai / Jeda Slide Otomatis">

                <a id="btnLbDownload" class="lb-btn" href="#" target="_blank" download title="Unduh Foto">

        <!-- Slide Progress Bar in Lightbox -->

        <!-- Prev / Next Navigation Arrows -->

        <!-- Main Content -->

                <div class="spinner"></div>
                <p class="spinner-text">Memuat foto...</p>
            </div>
            <img id="lbImage" src="" alt="Lightbox" style="display: none; opacity: 0;" />
            <div class="lb-caption-box">
                <p id="lbCaption"></p>
            </div>
        </div>
    </div>

    <script>
        const body = document.body;
        const icon = document.getElementById('toggleIcon');

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark');
            if (icon) icon.className = 'fas fa-sun';
        }

        function toggleDark() {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbyHFr2mR2wrQZJoRhr5DhBBkJ04fNiQ5OpEj9Tc1WnWZrDyv_c1bEWNmEWwzDIEJwWfMA/exec";

        let items = [];
        let currentDisplayItems = [];

        const galleryEl = document.getElementById('gallery');
        const searchInput = document.getElementById('search');

        function updatePhotoCount(count) {
            const countText = document.getElementById('photoCountText');
            if (countText) {
                countText.textContent = `${count} Momen`;
            }
        }

        function renderGallery(filter = '') {
            galleryEl.innerHTML = '';
            const filtered = items.filter(i => i.caption.toLowerCase().includes(filter.toLowerCase()));
            currentDisplayItems = filtered;
            updatePhotoCount(filtered.length);

            if (filtered.length === 0) {
                galleryEl.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 20px 0;">Tidak ada foto yang cocok.</p>';
                return;
            }

            filtered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.onclick = () => openLightbox(index);
                card.innerHTML = `
                <img src="${item.src}" alt="${item.caption}" loading="lazy">
                <div class="caption">${item.caption}</div>
            `;
                galleryEl.appendChild(card);
            });
        }

        // ===== HERO SLIDER BANNER =====
        let heroSlides = [];
        let currentHeroIndex = 0;
        let heroAutoplayTimer = null;
        let isHeroAutoplayPaused = false;
        const HERO_SLIDE_DURATION = 4500;
        let heroActiveImgTag = 'A';

        function initHeroSlider(photoList) {
            if (!photoList || photoList.length === 0) return;
            heroSlides = photoList.slice(0, 10);
            currentHeroIndex = 0;

            const heroBox = document.getElementById('heroBox');
            if (heroBox) heroBox.classList.remove('skeleton');

            buildHeroDots();
            showHeroSlide(0, true);
            startHeroAutoplay();
        }

        function buildHeroDots() {
            const dotsContainer = document.getElementById('heroDots');
            if (!dotsContainer) return;
            dotsContainer.innerHTML = '';
            const maxDots = Math.min(heroSlides.length, 8);
            for (let i = 0; i < maxDots; i++) {
                const dot = document.createElement('div');
                dot.className = `hero-dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = (e) => {
                    e.stopPropagation();
                    showHeroSlide(i);
                    startHeroAutoplay();
                };
                dotsContainer.appendChild(dot);
            }
        }

        function updateHeroDots(index) {
            const dots = document.querySelectorAll('.hero-dot');
            dots.forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
        }

        function showHeroSlide(index, isFirst = false) {
            if (heroSlides.length === 0) return;
            if (index < 0) index = heroSlides.length - 1;
            if (index >= heroSlides.length) index = 0;
            currentHeroIndex = index;

            const slide = heroSlides[currentHeroIndex];
            const slideA = document.getElementById('heroSlideA');
            const slideB = document.getElementById('heroSlideB');
            const heroTitle = document.getElementById('heroTitle');
            const heroBadgeText = document.getElementById('heroBadgeText');

            if (heroTitle) heroTitle.textContent = slide.caption;
            if (heroBadgeText) heroBadgeText.textContent = `Momen Unggulan #${currentHeroIndex + 1}`;
            updateHeroDots(currentHeroIndex);

            if (isFirst) {
                if (slideA) {
                    slideA.src = slide.fullSrc || slide.src;
                    slideA.classList.add('active');
                }
                if (slideB) slideB.classList.remove('active');
                heroActiveImgTag = 'A';
                resetHeroProgress();
                return;
            }

            if (heroActiveImgTag === 'A') {
                if (slideB) {
                    slideB.src = slide.fullSrc || slide.src;
                    const activateB = () => {
                        slideB.classList.add('active');
                        if (slideA) slideA.classList.remove('active');
                        heroActiveImgTag = 'B';
                    };
                    slideB.onload = activateB;
                    if (slideB.complete) activateB();
                }
            } else {
                if (slideA) {
                    slideA.src = slide.fullSrc || slide.src;
                    const activateA = () => {
                        slideA.classList.add('active');
                        if (slideB) slideB.classList.remove('active');
                        heroActiveImgTag = 'A';
                    };
                    slideA.onload = activateA;
                    if (slideA.complete) activateA();
                }
            }

            resetHeroProgress();
        }

        function resetHeroProgress() {
            const fill = document.getElementById('heroProgressFill');
            if (fill) {
                fill.style.transition = 'none';
                fill.style.width = '0%';
                if (!isHeroAutoplayPaused) {
                    setTimeout(() => {
                        fill.style.transition = `width ${HERO_SLIDE_DURATION}ms linear`;
                        fill.style.width = '100%';
                    }, 40);
                }
            }
        }

        function startHeroAutoplay() {
            if (heroAutoplayTimer) clearInterval(heroAutoplayTimer);
            if (isHeroAutoplayPaused) return;

            resetHeroProgress();
            heroAutoplayTimer = setInterval(() => {
                showHeroSlide(currentHeroIndex + 1);
            }, HERO_SLIDE_DURATION);
        }

        function nextHeroSlide() {
            showHeroSlide(currentHeroIndex + 1);
            startHeroAutoplay();
        }

        function prevHeroSlide() {
            showHeroSlide(currentHeroIndex - 1);
            startHeroAutoplay();
        }

        function toggleHeroSlideshow() {
            isHeroAutoplayPaused = !isHeroAutoplayPaused;
            const heroPauseIcon = document.getElementById('heroPauseIcon');
            const heroPauseBtn = document.getElementById('heroPauseBtn');
            const fill = document.getElementById('heroProgressFill');

            if (isHeroAutoplayPaused) {
                if (heroAutoplayTimer) clearInterval(heroAutoplayTimer);
                if (heroPauseIcon) heroPauseIcon.className = 'fas fa-play';
                if (heroPauseBtn) heroPauseBtn.title = 'Lanjutkan Slide';
                if (fill) fill.style.transition = 'none';
            } else {
                if (heroPauseIcon) heroPauseIcon.className = 'fas fa-pause';
                if (heroPauseBtn) heroPauseBtn.title = 'Jeda Slide';
                startHeroAutoplay();
            }
        }

        function openCurrentHeroInLightbox() {
            if (heroSlides.length === 0) return;
            const targetSlide = heroSlides[currentHeroIndex];
            const targetIndex = currentDisplayItems.findIndex(i => i.id === targetSlide.id);
            openLightbox(targetIndex !== -1 ? targetIndex : 0);
        }

        // ===== LIGHTBOX & FULLSCREEN SLIDESHOW =====
        let currentLbIndex = 0;
        let lbSlideshowInterval = null;
        const LB_SLIDE_DURATION = 3500;

        function openLightbox(itemOrIndex) {
            if (!currentDisplayItems || currentDisplayItems.length === 0) {
                currentDisplayItems = items;
            }
            if (typeof itemOrIndex === 'number') {
                currentLbIndex = itemOrIndex;
            } else {
                const found = currentDisplayItems.indexOf(itemOrIndex);
                currentLbIndex = found !== -1 ? found : 0;
            }
            showLbSlide(currentLbIndex);
        }

        function showLbSlide(index) {
            if (!currentDisplayItems || currentDisplayItems.length === 0) return;
            if (index < 0) index = currentDisplayItems.length - 1;
            if (index >= currentDisplayItems.length) index = 0;
            currentLbIndex = index;

            const item = currentDisplayItems[currentLbIndex];
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImage');
            const lbSpinner = document.getElementById('lbSpinner');
            const lbCaption = document.getElementById('lbCaption');
            const lbCounter = document.getElementById('lbCounter');
            const btnLbDownload = document.getElementById('btnLbDownload');

            if (lbCounter) {
                lbCounter.textContent = `${currentLbIndex + 1} / ${currentDisplayItems.length}`;
            }

            if (btnLbDownload) {
                btnLbDownload.href = item.fullSrc || item.src;
                btnLbDownload.download = `${item.caption || 'TRJT24-Memories'}.jpg`;
            }

            if (lbCaption) lbCaption.textContent = item.caption;
            if (lbSpinner) lbSpinner.style.display = 'flex';
            if (lbImg) {
                lbImg.style.display = 'none';
                lbImg.style.opacity = '0';
            }

            lb.classList.add('open');
            document.body.style.overflow = 'hidden';

            if (lbImg) {
                lbImg.onload = function () {
                    if (lbSpinner) lbSpinner.style.display = 'none';
                    lbImg.style.display = 'block';
                    setTimeout(() => {
                        lbImg.style.opacity = '1';
                    }, 20);
                };

                lbImg.onerror = function () {
                    if (this.src !== item.src) {
                        this.src = item.src;
                    } else {
                        if (lbSpinner) lbSpinner.style.display = 'none';
                        lbImg.style.display = 'block';
                        lbImg.style.opacity = '1';
                    }
                };

                lbImg.src = item.fullSrc || item.src;
                if (lbImg.complete && lbImg.naturalHeight > 0) {
                    if (lbSpinner) lbSpinner.style.display = 'none';
                    lbImg.style.display = 'block';
                    lbImg.style.opacity = '1';
                }
            }

            if (lbSlideshowInterval) {
                restartLbSlideTimer();
            }
        }

        function nextLbSlide() {
            showLbSlide(currentLbIndex + 1);
        }

        function prevLbSlide() {
            showLbSlide(currentLbIndex - 1);
        }

        function toggleLbSlideshow() {
            if (lbSlideshowInterval) {
                stopLbSlideshow();
            } else {
                startLbSlideshow();
            }
        }

        function startLbSlideshow() {
            const lbProgressBar = document.getElementById('lbProgressBar');
            const lbSlideIcon = document.getElementById('lbSlideIcon');
            const btnLbSlide = document.getElementById('btnLbSlide');

            if (btnLbSlide) btnLbSlide.classList.add('active');
            if (lbSlideIcon) lbSlideIcon.className = 'fas fa-pause';
            if (lbProgressBar) lbProgressBar.style.display = 'block';

            restartLbSlideTimer();
        }

        function restartLbSlideTimer() {
            if (lbSlideshowInterval) clearInterval(lbSlideshowInterval);
            const lbProgressFill = document.getElementById('lbProgressFill');
            if (lbProgressFill) {
                lbProgressFill.style.transition = 'none';
                lbProgressFill.style.width = '0%';
                setTimeout(() => {
                    lbProgressFill.style.transition = `width ${LB_SLIDE_DURATION}ms linear`;
                    lbProgressFill.style.width = '100%';
                }, 30);
            }

            lbSlideshowInterval = setInterval(() => {
                nextLbSlide();
            }, LB_SLIDE_DURATION);
        }

        function stopLbSlideshow() {
            if (lbSlideshowInterval) {
                clearInterval(lbSlideshowInterval);
                lbSlideshowInterval = null;
            }
            const lbProgressBar = document.getElementById('lbProgressBar');
            const lbSlideIcon = document.getElementById('lbSlideIcon');
            const btnLbSlide = document.getElementById('btnLbSlide');

            if (btnLbSlide) btnLbSlide.classList.remove('active');
            if (lbSlideIcon) lbSlideIcon.className = 'fas fa-play';
            if (lbProgressBar) lbProgressBar.style.display = 'none';
        }

        function closeLightbox() {
            stopLbSlideshow();
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImage');
            const lbSpinner = document.getElementById('lbSpinner');

            lb.classList.remove('open');
            if (lbImg) {
                lbImg.src = '';
                lbImg.onload = null;
                lbImg.onerror = null;
                lbImg.style.display = 'none';
                lbImg.style.opacity = '0';
            }
            if (lbSpinner) lbSpinner.style.display = 'none';
            document.body.style.overflow = '';
        }

        function openRandomPhoto() {
            if (!currentDisplayItems || currentDisplayItems.length === 0) {
                currentDisplayItems = items;
            }
            if (currentDisplayItems.length === 0) return;
            const randIndex = Math.floor(Math.random() * currentDisplayItems.length);
            openLightbox(randIndex);
        }

        function startFullscreenSlideshow() {
            if (!currentDisplayItems || currentDisplayItems.length === 0) {
                currentDisplayItems = items;
            }
            if (currentDisplayItems.length === 0) return;
            openLightbox(0);
            startLbSlideshow();
        }

        function toggleFullscreenLightbox() {
            const lb = document.getElementById('lightbox');
            const lbFsIcon = document.getElementById('lbFsIcon');
            if (!document.fullscreenElement) {
                lb.requestFullscreen?.().catch(() => {});
                if (lbFsIcon) lbFsIcon.className = 'fas fa-compress';
            } else {
                document.exitFullscreen?.().catch(() => {});
                if (lbFsIcon) lbFsIcon.className = 'fas fa-expand';
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const lbFsIcon = document.getElementById('lbFsIcon');
            if (lbFsIcon) {
                lbFsIcon.className = document.fullscreenElement ? 'fas fa-compress' : 'fas fa-expand';
            }
        });

        // Touch Swipe Gesture for Lightbox
        let touchStartX = 0;
        let touchEndX = 0;
        const lbEl = document.getElementById('lightbox');
        if (lbEl) {
            lbEl.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            lbEl.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 45) {
                    if (diff < 0) nextLbSlide();
                    else prevLbSlide();
                }
            }, { passive: true });
        }

        window.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (!lb || !lb.classList.contains('open')) return;

            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowRight') {
                nextLbSlide();
            } else if (e.key === 'ArrowLeft') {
                prevLbSlide();
            } else if (e.key === ' ') {
                e.preventDefault();
                toggleLbSlideshow();
            }
        });

        searchInput.addEventListener('input', (e) => renderGallery(e.target.value));

        const btnCollage = document.getElementById('btnCollage');
        const collageSection = document.getElementById('collageSection');
        const collageEl = document.getElementById('collage');

        btnCollage.onclick = () => {
            const isHidden = collageSection.style.display === 'none';
            collageSection.style.display = isHidden ? 'block' : 'none';
            btnCollage.textContent = isHidden ? 'Sembunyikan Collage' : 'Tampilkan Collage';

            if (isHidden && collageEl.innerHTML === '') {
                items.forEach(item => {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.caption;
                    img.loading = 'lazy';
                    collageEl.appendChild(img);
                });
            }
        };

        function showSkeletonCards(count = 12) {
            galleryEl.innerHTML = Array.from({ length: count }).map(() => `
            <div class="gallery-card skeleton-card">
                <div class="skeleton skeleton-thumb"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
        `).join('');
        }

        const driveLoading = document.getElementById('driveLoading');
        const driveStatusText = document.getElementById('driveStatusText');
        const btnReload = document.getElementById('btnReload');

        async function loadDrivePhotos(isManualReload = false) {
            if (driveLoading) {
                driveLoading.classList.remove('hidden');
                if (driveStatusText) driveStatusText.textContent = 'Menghubungkan dan mengambil foto TRJT 24...';
            }
            if (btnReload) btnReload.classList.add('spinning');
            showSkeletonCards(12);

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error('HTTP error: ' + response.status);
                }
                const data = await response.json();
                const list = Array.isArray(data) ? data : (data.images || data.data || []);

                if (!list || list.length === 0) {
                    galleryEl.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 20px 0;">Tidak ada foto ditemukan di Google Drive.</p>';
                    if (driveLoading) driveLoading.classList.add('hidden');
                    return;
                }

                items = list.map((item, index) => {
                    const cleanName = item.name ? item.name.replace(/\.[^/.]+$/, '') : `Foto ${index + 1}`;

                    // Gunakan thumbnail Google Drive (karena link uc?export=view diblokir/403 oleh Google)
                    const cardThumb = item.thumbnail || (item.id ? `https://drive.google.com/thumbnail?id=${item.id}&sz=w800` : item.url);
                    // Resolusi tinggi untuk Lightbox (sz=w1600)
                    const fullRes = item.id
                        ? `https://drive.google.com/thumbnail?id=${item.id}&sz=w1600`
                        : (item.thumbnail ? item.thumbnail.replace(/sz=w\d+/, 'sz=w1600') : cardThumb);

                    return {
                        id: item.id || String(index + 1),
                        caption: cleanName,
                        src: cardThumb,
                        fullSrc: fullRes
                    };
                });

                renderGallery();
                initHeroSlider(items);

                // Animasi transisi smooth saat selesai memuat
                setTimeout(() => {
                    if (driveLoading) driveLoading.classList.add('hidden');
                }, 400);
            } catch (err) {
                console.error('Gagal mengambil data foto:', err);
                if (driveStatusText) {
                    driveStatusText.innerHTML = '<span style="color: #ef4444;">Gagal memuat dari Google Drive. <a href="javascript:void(0)" onclick="loadDrivePhotos(true)" style="color: var(--accent); font-weight: 600; text-decoration: underline; margin-left: 5px;">Coba Lagi</a></span>';
                }
                galleryEl.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 30px 20px;">
                        <i class="fas fa-triangle-exclamation" style="font-size: 2rem; color: #f59e0b; margin-bottom: 10px; display: block;"></i>
                        <p style="font-weight: 600; margin-bottom: 6px;">Gagal memuat foto dari Google Drive</p>
                        <p style="font-size: 0.85rem; margin-bottom: 15px;">Periksa koneksi internet atau coba muat ulang.</p>
                        <button onclick="loadDrivePhotos(true)" class="btn btn-secondary" style="padding: 8px 18px; font-size: 0.85rem; cursor: pointer;">
                            <i class="fas fa-rotate-right" style="margin-right: 6px;"></i> Muat Ulang
                        </button>
                    </div>
                `;
            } finally {
                if (btnReload) btnReload.classList.remove('spinning');
            }
        }

        loadDrivePhotos();


        // ===== AUDIO / MUSIK LATAR & PLAYLIST DARI GOOGLE DRIVE =====
        const playlist = [
            { id: 0, title: 'Musik 1 (Memories)', file: 'musik1.mp3', driveId: '11j9lk8wmLoZ5s-AB-gtu1udjgFPsyFLQ' },
            { id: 1, title: 'Musik 2 (Vibes)', file: 'musik2.mp3', driveId: '1otCe3NZ1hiBUv0ysol5tZHORvkm4jdfN' },
            { id: 2, title: 'Musik 3 (Acoustic)', file: 'musik3.mp3', driveId: '1s-xJ3JSUFludXckXHoBjGX29_XGScWLs' },
            { id: 3, title: 'Musik 4 (Chill)', file: 'musik4.mp3', driveId: '1HL1bIABLUaVcgBil7PmfLNB81lP_DGmG' },
            { id: 4, title: 'Musik 5 (Besto)', file: 'musik5.mp3', driveId: '1Q73ByGPCs-WPmJ-eQHQCzSuGn9N8BFAo' }
        ];

        let currentTrackIndex = 0;
        let isShuffle = true; // Mode musik acak aktif secara default saat memulai
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        const musicSelect = document.getElementById('musicSelect');
        const soundTrackLabel = document.getElementById('soundTrackLabel');
        let isUserManuallyPaused = false;

        function getRandomTrackIndex(excludeIndex = -1) {
            if (playlist.length <= 1) return 0;
            let nextIdx;
            let attempts = 0;
            do {
                nextIdx = Math.floor(Math.random() * playlist.length);
                attempts++;
            } while (nextIdx === excludeIndex && attempts < 20);
            return nextIdx;
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('btnShuffle');
            if (btn) {
                btn.classList.toggle('active', isShuffle);
                btn.title = isShuffle ? 'Mode Acak: Aktif' : 'Mode Acak: Nonaktif';
            }
            const soundStatus = document.getElementById('soundStatus');
            if (soundStatus && bgMusic && !bgMusic.paused) {
                soundStatus.innerHTML = isShuffle ? '<i class="fas fa-shuffle" style="font-size:0.68rem; margin-right:3px;"></i> Acak' : 'Diputar';
            }
        }

        function loadTrack(index, autoPlay = true) {
            if (index < 0) index = playlist.length - 1;
            if (index >= playlist.length) index = 0;
            currentTrackIndex = index;

            const track = playlist[currentTrackIndex];
            if (bgMusic) {
                bgMusic.src = track.file;
            }

            if (musicSelect) musicSelect.value = String(currentTrackIndex);
            if (soundTrackLabel) {
                soundTrackLabel.innerHTML = `<i class="fas fa-music" style="color: var(--accent); margin-right: 6px;"></i> ${track.title}`;
            }

            if (autoPlay && !isUserManuallyPaused) {
                playMusic();
            }
        }

        function changeTrack(val) {
            isUserManuallyPaused = false;
            loadTrack(parseInt(val, 10), true);
        }

        function nextTrack() {
            isUserManuallyPaused = false;
            if (isShuffle) {
                const nextIdx = getRandomTrackIndex(currentTrackIndex);
                loadTrack(nextIdx, true);
            } else {
                loadTrack(currentTrackIndex + 1, true);
            }
        }

        function prevTrack() {
            isUserManuallyPaused = false;
            if (isShuffle) {
                const prevIdx = getRandomTrackIndex(currentTrackIndex);
                loadTrack(prevIdx, true);
            } else {
                loadTrack(currentTrackIndex - 1, true);
            }
        }

        if (bgMusic) {
            // Otomatis putar lagu berikutnya secara acak saat lagu selesai
            bgMusic.addEventListener('ended', () => {
                nextTrack();
            });

            // Fallback otomatis ke link stream Google Drive jika file lokal belum dimuat
            bgMusic.addEventListener('error', () => {
                const track = playlist[currentTrackIndex];
                if (track && track.driveId) {
                    const fallbackUrl = `https://drive.usercontent.google.com/download?id=${track.driveId}&export=download&authuser=0`;
                    if (bgMusic.src !== fallbackUrl) {
                        bgMusic.src = fallbackUrl;
                        if (!isUserManuallyPaused) bgMusic.play().catch(() => {});
                    }
                }
            });
        }

        function updateMusicUI(isPlaying) {
            const musicBtnText = document.getElementById('musicBtnText');
            const soundStatus = document.getElementById('soundStatus');
            const soundEqualizer = document.getElementById('soundEqualizer');

            if (isPlaying) {
                if (musicToggle) musicToggle.classList.add('playing');
                if (musicIcon) musicIcon.className = 'fas fa-volume-high';
                if (musicToggle) musicToggle.title = 'Matikan Musik';
                if (musicBtnText) musicBtnText.textContent = 'Matikan';
                if (soundStatus) {
                    soundStatus.innerHTML = isShuffle ? '<i class="fas fa-shuffle" style="font-size:0.68rem; margin-right:3px;"></i> Acak' : 'Diputar';
                    soundStatus.classList.remove('paused');
                }
                if (soundEqualizer) soundEqualizer.classList.remove('paused');
            } else {
                if (musicToggle) musicToggle.classList.remove('playing');
                if (musicIcon) musicIcon.className = 'fas fa-volume-xmark';
                if (musicToggle) musicToggle.title = 'Putar Musik';
                if (musicBtnText) musicBtnText.textContent = 'Putar';
                if (soundStatus) {
                    soundStatus.textContent = 'Dijeda';
                    soundStatus.classList.add('paused');
                }
                if (soundEqualizer) soundEqualizer.classList.add('paused');
            }
        }

        function playMusic() {
            if (isUserManuallyPaused || !bgMusic) return;

            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    updateMusicUI(true);
                }).catch(() => {
                    updateMusicUI(false);

                    const enableAudioOnInteraction = () => {
                        if (!isUserManuallyPaused && bgMusic.paused) {
                            bgMusic.play().then(() => {
                                updateMusicUI(true);
                            }).catch(() => {});
                        }
                        cleanupListeners();
                    };

                    function cleanupListeners() {
                        window.removeEventListener('click', enableAudioOnInteraction);
                        window.removeEventListener('touchstart', enableAudioOnInteraction);
                        window.removeEventListener('keydown', enableAudioOnInteraction);
                        window.removeEventListener('scroll', enableAudioOnInteraction);
                    }

                    window.addEventListener('click', enableAudioOnInteraction, { once: true });
                    window.addEventListener('touchstart', enableAudioOnInteraction, { once: true });
                    window.addEventListener('keydown', enableAudioOnInteraction, { once: true });
                    window.addEventListener('scroll', enableAudioOnInteraction, { once: true });
                });
            }
        }

        function toggleMusic() {
            if (!bgMusic) return;

            if (bgMusic.paused) {
                isUserManuallyPaused = false;
                bgMusic.play().then(() => {
                    updateMusicUI(true);
                }).catch(err => {
                    console.error('Gagal memutar musik:', err);
                });
            } else {
                isUserManuallyPaused = true;
                bgMusic.pause();
                updateMusicUI(false);
            }
        }

        // Putar musik acak otomatis saat halaman masuk
        function initMusic() {
            const initialTrack = isShuffle ? getRandomTrackIndex(-1) : 0;
            loadTrack(initialTrack, true);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMusic);
        } else {
            initMusic();
        }
    </script>
</body>

</html>
