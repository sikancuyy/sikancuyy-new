<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galery TRJT 24 - SikanCuyy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Sora:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../favicon/08_besto_friendo.svg" type="image/svg+xml">
    <style>
        .hero-img-box {
            width: 100%;
            height: 350px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: var(--shadow-lg);
        }

        .hero-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .hero-img-box:hover img {
            transform: scale(1.05);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .gallery-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }

        .gallery-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .gallery-card .caption {
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
        }

        @keyframes skeleton-shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(180, 180, 180, 0.12) 25%, rgba(180, 180, 180, 0.28) 50%, rgba(180, 180, 180, 0.12) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite ease-in-out;
        }

        body.dark .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.12) 50%, rgba(255, 255, 255, 0.04) 75%);
            background-size: 200% 100%;
        }

        .skeleton-card {
            pointer-events: none;
        }

        .skeleton-thumb {
            width: 100%;
            height: 120px;
            border-radius: var(--radius-sm);
        }

        .skeleton-text {
            height: 12px;
            width: 70%;
            margin: 10px auto 4px auto;
            border-radius: 4px;
        }

        .collage-box {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            margin-top: 20px;
        }

        .collage-box img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            .collage-box {
                grid-template-columns: repeat(3, 1fr);
            }

            .hero-img-box {
                height: 250px;
            }
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .spinner {
            /* Spinner size and color */
            width: 1.5rem;
            height: 1.5rem;
            border-top-color: #444;
            border-left-color: #444;

            /* Additional spinner styles */
            animation: spinner 400ms linear infinite;
            border-bottom-color: transparent;
            border-right-color: transparent;
            border-style: solid;
            border-width: 2px;
            border-radius: 50%;
            box-sizing: border-box;
            display: inline-block;
            vertical-align: middle;
        }

        body.dark .spinner {
            border-top-color: #f1f5f9;
            border-left-color: #f1f5f9;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-content {
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
        }

        .lightbox-spinner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 12px;
            min-height: 180px;
        }

        .lightbox .spinner {
            width: 2.5rem;
            height: 2.5rem;
            border-width: 3px;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
        }

        .lightbox-spinner-wrap .spinner-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--radius-md);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.25s ease;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Drive Loading Box */
        .drive-loading-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drive-loading-box.hidden {
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-bottom: 0;
            border-color: transparent;
            pointer-events: none;
        }

        .drive-loading-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .drive-icon-container {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(66, 133, 244, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        body.dark .drive-icon-container {
            background: rgba(66, 133, 244, 0.16);
        }

        .drive-brand-icon {
            font-size: 1.65rem;
            background: linear-gradient(135deg, #4285F4 20%, #0F9D58 55%, #F4B400 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: driveFloat 2.2s ease-in-out infinite alternate;
        }

        @keyframes driveFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-3px) scale(1.08); }
        }

        .drive-pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 14px;
            border: 2px solid rgba(66, 133, 244, 0.4);
            animation: drivePulse 2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
            pointer-events: none;
        }

        @keyframes drivePulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            70% { transform: scale(1.15); opacity: 0; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        .drive-info {
            flex: 1;
            min-width: 0;
        }

        .drive-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drive-dots {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .drive-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            animation: driveDotBounce 1.4s infinite ease-in-out both;
        }

        .drive-dots span:nth-child(1) { animation-delay: -0.32s; }
        .drive-dots span:nth-child(2) { animation-delay: -0.16s; }
        .drive-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes driveDotBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .drive-subtext {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .drive-progress-track {
            height: 4px;
            width: 100%;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 14px;
            position: relative;
        }

        body.dark .drive-progress-track {
            background: rgba(255, 255, 255, 0.08);
        }

        .drive-progress-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            border-radius: 99px;
            background: linear-gradient(90deg, #4285F4, #0F9D58, #F4B400, #4285F4);
            background-size: 200% 100%;
            animation: driveIndeterminate 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes driveIndeterminate {
            0% { left: -40%; background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { left: 100%; background-position: 200% 50%; }
        }

        /* Reload button */
        .btn-icon-reload {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .btn-icon-reload:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-light);
            transform: rotate(45deg);
        }

        body.dark .btn-icon-reload:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .btn-icon-reload.spinning i {
            animation: spinner 0.7s linear infinite;
            color: var(--accent);
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div class="logo-badge"><span></span> Memories</div>
            <h1>Galery <span class="accent">TRJT 24</span></h1>
            <p class="subtitle">Memories · TRJT 24</p>
            <div class="divider"></div>
        </header>

        <div id="heroBox" class="hero-img-box skeleton">
            <img id="heroImage" src="" alt="Hero Image"
                style="display: none; width: 100%; height: 100%; object-fit: cover;"
                onload="this.style.display='block'; document.getElementById('heroBox')?.classList.remove('skeleton');"
                onerror="document.getElementById('heroBox')?.classList.remove('skeleton');" />
        </div>

        <div class="card" style="margin-bottom: 20px; padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
            <i class="fas fa-search" style="color: var(--text-secondary);"></i>
            <input type="search" id="search" placeholder="Cari momen..."
                style="border: none; padding: 0; background: transparent; width: 100%; outline: none; font-size: 0.95rem; color: inherit;" />
            <button id="btnReload" class="btn-icon-reload" title="Muat ulang dari Google Drive" onclick="loadDrivePhotos(true)">
                <i class="fas fa-rotate-right" id="reloadIcon"></i>
            </button>
        </div>

        <!-- Indikator Memuat dari Drive -->
        <div id="driveLoading" class="drive-loading-box">
            <div class="drive-loading-header">
                <div class="drive-icon-container">
                    <i class="fab fa-google-drive drive-brand-icon"></i>
                    <span class="drive-pulse-ring"></span>
                </div>
                <div class="drive-info">
                    <div class="drive-title">
                        <span>Memuat dari Google Drive</span>
                        <span class="drive-dots">
                            <span></span><span></span><span></span>
                        </span>
                    </div>
                    <p class="drive-subtext" id="driveStatusText">Menghubungkan dan mengambil foto TRJT 24...</p>
                </div>
            </div>
            <div class="drive-progress-track">
                <div class="drive-progress-bar"></div>
            </div>
        </div>

        <div id="gallery" class="gallery-grid">
            <!-- Injected -->
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button id="btnCollage" class="btn btn-secondary">Tampilkan Collage</button>
        </div>

        <div id="collageSection" class="card" style="display: none; margin-top: 25px;">
            <h3 class="section-title">Semua Foto</h3>
            <div id="collage" class="collage-box"></div>
        </div>

        <footer>
            Dibuat oleh <a href="../../portofolio/index.html">SikanCuyy</a> &mdash; 2025
        </footer>
    </div>

    <a href="../index.html" class="back-btn" title="Kembali">
        <i class="fas fa-arrow-left"></i>
    </a>

    <button class="dark-toggle" onclick="toggleDark()" title="Toggle Dark Mode">
        <i class="fas fa-moon" id="toggleIcon"></i>
    </button>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <div id="lbSpinner" class="lightbox-spinner-wrap" style="display: none;">
                <div class="spinner"></div>
                <p class="spinner-text">Memuat foto...</p>
            </div>
            <img id="lbImage" src="" alt="Lightbox" style="display: none; opacity: 0;" />
            <p id="lbCaption" style="color: white; margin-top: 15px; font-weight: 600;"></p>
        </div>
    </div>

    <script>
        const body = document.body;
        const icon = document.getElementById('toggleIcon');

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark');
            if (icon) icon.className = 'fas fa-sun';
        }

        function toggleDark() {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbyHFr2mR2wrQZJoRhr5DhBBkJ04fNiQ5OpEj9Tc1WnWZrDyv_c1bEWNmEWwzDIEJwWfMA/exec";

        let items = [];

        const galleryEl = document.getElementById('gallery');
        const searchInput = document.getElementById('search');

        function renderGallery(filter = '') {
            galleryEl.innerHTML = '';
            const filtered = items.filter(i => i.caption.toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                galleryEl.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 20px 0;">Tidak ada foto yang cocok.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.onclick = () => openLightbox(item);
                card.innerHTML = `
                <img src="${item.src}" alt="${item.caption}" loading="lazy">
                <div class="caption">${item.caption}</div>
            `;
                galleryEl.appendChild(card);
            });
        }

        function openLightbox(item) {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImage');
            const lbSpinner = document.getElementById('lbSpinner');
            const lbCaption = document.getElementById('lbCaption');

            lbCaption.textContent = item.caption;
            if (lbSpinner) lbSpinner.style.display = 'flex';
            lbImg.style.display = 'none';
            lbImg.style.opacity = '0';

            lb.classList.add('open');
            document.body.style.overflow = 'hidden';

            lbImg.onload = function () {
                if (lbSpinner) lbSpinner.style.display = 'none';
                lbImg.style.display = 'block';
                setTimeout(() => {
                    lbImg.style.opacity = '1';
                }, 20);
            };

            lbImg.onerror = function () {
                if (this.src !== item.src) {
                    this.src = item.src;
                } else {
                    if (lbSpinner) lbSpinner.style.display = 'none';
                    lbImg.style.display = 'block';
                    lbImg.style.opacity = '1';
                }
            };

            lbImg.src = item.fullSrc || item.src;
            if (lbImg.complete && lbImg.naturalHeight > 0) {
                if (lbSpinner) lbSpinner.style.display = 'none';
                lbImg.style.display = 'block';
                lbImg.style.opacity = '1';
            }
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImage');
            const lbSpinner = document.getElementById('lbSpinner');

            lb.classList.remove('open');
            lbImg.src = '';
            lbImg.onload = null;
            lbImg.onerror = null;
            lbImg.style.display = 'none';
            lbImg.style.opacity = '0';
            if (lbSpinner) lbSpinner.style.display = 'none';
            document.body.style.overflow = '';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        searchInput.addEventListener('input', (e) => renderGallery(e.target.value));

        const btnCollage = document.getElementById('btnCollage');
        const collageSection = document.getElementById('collageSection');
        const collageEl = document.getElementById('collage');

        btnCollage.onclick = () => {
            const isHidden = collageSection.style.display === 'none';
            collageSection.style.display = isHidden ? 'block' : 'none';
            btnCollage.textContent = isHidden ? 'Sembunyikan Collage' : 'Tampilkan Collage';

            if (isHidden && collageEl.innerHTML === '') {
                items.forEach(item => {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.caption;
                    img.loading = 'lazy';
                    collageEl.appendChild(img);
                });
            }
        };

        function showSkeletonCards(count = 12) {
            galleryEl.innerHTML = Array.from({ length: count }).map(() => `
            <div class="gallery-card skeleton-card">
                <div class="skeleton skeleton-thumb"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
        `).join('');
        }

        const driveLoading = document.getElementById('driveLoading');
        const driveStatusText = document.getElementById('driveStatusText');
        const btnReload = document.getElementById('btnReload');

        async function loadDrivePhotos(isManualReload = false) {
            if (driveLoading) {
                driveLoading.classList.remove('hidden');
                if (driveStatusText) driveStatusText.textContent = 'Menghubungkan dan mengambil foto TRJT 24...';
            }
            if (btnReload) btnReload.classList.add('spinning');
            showSkeletonCards(12);

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error('HTTP error: ' + response.status);
                }
                const data = await response.json();
                const list = Array.isArray(data) ? data : (data.images || data.data || []);

                if (!list || list.length === 0) {
                    galleryEl.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 20px 0;">Tidak ada foto ditemukan di Google Drive.</p>';
                    if (driveLoading) driveLoading.classList.add('hidden');
                    return;
                }

                items = list.map((item, index) => {
                    const cleanName = item.name ? item.name.replace(/\.[^/.]+$/, '') : `Foto ${index + 1}`;

                    // Gunakan thumbnail Google Drive (karena link uc?export=view diblokir/403 oleh Google)
                    const cardThumb = item.thumbnail || (item.id ? `https://drive.google.com/thumbnail?id=${item.id}&sz=w800` : item.url);
                    // Resolusi tinggi untuk Lightbox (sz=w1600)
                    const fullRes = item.id
                        ? `https://drive.google.com/thumbnail?id=${item.id}&sz=w1600`
                        : (item.thumbnail ? item.thumbnail.replace(/sz=w\d+/, 'sz=w1600') : cardThumb);

                    return {
                        id: item.id || String(index + 1),
                        caption: cleanName,
                        src: cardThumb,
                        fullSrc: fullRes
                    };
                });

                const heroImg = document.getElementById('heroImage');
                if (heroImg && items.length > 0) {
                    heroImg.src = items[0].src;
                }

                renderGallery();

                // Animasi transisi smooth saat selesai memuat
                setTimeout(() => {
                    if (driveLoading) driveLoading.classList.add('hidden');
                }, 400);
            } catch (err) {
                console.error('Gagal mengambil data foto:', err);
                if (driveStatusText) {
                    driveStatusText.innerHTML = '<span style="color: #ef4444;">Gagal memuat dari Google Drive. <a href="javascript:void(0)" onclick="loadDrivePhotos(true)" style="color: var(--accent); font-weight: 600; text-decoration: underline; margin-left: 5px;">Coba Lagi</a></span>';
                }
                galleryEl.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 30px 20px;">
                        <i class="fas fa-triangle-exclamation" style="font-size: 2rem; color: #f59e0b; margin-bottom: 10px; display: block;"></i>
                        <p style="font-weight: 600; margin-bottom: 6px;">Gagal memuat foto dari Google Drive</p>
                        <p style="font-size: 0.85rem; margin-bottom: 15px;">Periksa koneksi internet atau coba muat ulang.</p>
                        <button onclick="loadDrivePhotos(true)" class="btn btn-secondary" style="padding: 8px 18px; font-size: 0.85rem; cursor: pointer;">
                            <i class="fas fa-rotate-right" style="margin-right: 6px;"></i> Muat Ulang
                        </button>
                    </div>
                `;
            } finally {
                if (btnReload) btnReload.classList.remove('spinning');
            }
        }

        loadDrivePhotos();
    </script>
</body>

</html>
